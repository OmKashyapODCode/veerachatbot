services:
  - type: web
    name: vera-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false  # Set this in Render dashboard
      - key: LLM_MODEL
        value: gemini-2.0-flash
      - key: LLM_TIMEOUT
        value: "20"
      - key: TEAM_NAME
        value: "Team Vera"
      - key: TEAM_MEMBERS
        value: "Developer"
      - key: CONTACT_EMAIL
        value: "contact@example.com"
      - key: APP_VERSION
        value: "1.0.0"
      - key: MODEL_NAME
        value: "gemini-2.0-flash"
    healthCheckPath: /v1/healthz
